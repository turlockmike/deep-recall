<svg xmlns="http://www.w3.org/2000/svg" width="760" height="346" viewBox="0 0 760 346" role="img" aria-labelledby="t d"><title id="t">What the reranker adds</title><desc id="d">Hybrid search alone versus with deep-recall's answerability reranker. 5,200-note memory: 61.6% to about 97%. LongMemEval-S: 87.2% to 97.4%.</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}.bg{fill:#fcfcfb}.ink{fill:#0b0b0b}.ink2{fill:#52514e}.muted{fill:#898781}.grid{stroke:#e1e0d9}.axis{stroke:#c3c2b7}.gray{fill:#a8a69e}.accent{fill:#2a78d6}@media (prefers-color-scheme:dark){.bg{fill:#1a1a19}.ink{fill:#ffffff}.ink2{fill:#c3c2b7}.muted{fill:#898781}.grid{stroke:#2c2c2a}.axis{stroke:#383835}.gray{fill:#6b6a65}.accent{fill:#3987e5}}</style><rect class="bg" width="760" height="346" rx="8"/><text class="ink" x="24" y="40" font-size="20" font-weight="600">Search finds notes about the question. The reranker finds the answer.</text><text class="ink2" x="24" y="64" font-size="13">Blue: the same search plus deep-recall's rare-term candidates, ranked by its answerability reranker (jev).</text><text class="ink" x="24" y="110" font-size="14" font-weight="600">A real 5,200-note agent memory<tspan class="muted" font-size="12" font-weight="400" dx="10">right file ranked #1 · 99 held-out questions</tspan></text><text class="ink2" x="240" y="137" font-size="12" text-anchor="end">Hybrid search</text><path class="gray" d="M250.0,122.0h254.7a4.0,4.0 0 0 1 4.0,4.0v14.0a4.0,4.0 0 0 1 -4.0,4.0h-254.7z"/><text class="ink" x="516.72" y="138" font-size="14">61.6%</text><text class="ink2" x="240" y="167" font-size="12" text-anchor="end">+ reranker</text><path class="accent" d="M250.0,152.0h403.4a4.0,4.0 0 0 1 4.0,4.0v14.0a4.0,4.0 0 0 1 -4.0,4.0h-403.4z"/><text class="ink" x="665.4" y="168" font-size="14" font-weight="700">~97%</text><line class="axis" x1="250" x2="250" y1="118" y2="178" stroke-width="1"/><text class="ink" x="24" y="216" font-size="14" font-weight="600">LongMemEval-S (public benchmark)<tspan class="muted" font-size="12" font-weight="400" dx="10">every evidence session in the top 5 · 470 questions</tspan></text><text class="ink2" x="240" y="243" font-size="12" text-anchor="end">Hybrid search</text><path class="gray" d="M250.0,228.0h362.4a4.0,4.0 0 0 1 4.0,4.0v14.0a4.0,4.0 0 0 1 -4.0,4.0h-362.4z"/><text class="ink" x="624.3829787234042" y="244" font-size="14">87.2%</text><text class="ink2" x="240" y="273" font-size="12" text-anchor="end">+ reranker</text><path class="accent" d="M250.0,258.0h405.3a4.0,4.0 0 0 1 4.0,4.0v14.0a4.0,4.0 0 0 1 -4.0,4.0h-405.3z"/><text class="ink" x="667.2765957446809" y="274" font-size="14" font-weight="700">97.4%</text><line class="axis" x1="250" x2="250" y1="224" y2="284" stroke-width="1"/><text class="muted" x="24" y="312" font-size="11">Retrieval, not answer accuracy: whether the context handed to your LLM holds the facts.</text><text class="muted" x="24" y="328" font-size="11">LongMemEval: github.com/xiaowu0162/LongMemEval · results and method: bench/longmemeval/</text></svg>
